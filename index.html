<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wake Div Signage — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400..700;1,400..700&family=Nunito+Sans:opsz,wdth,wght@6..12,75..125,300..900&family=Montserrat:wght@400..800&display=swap" rel="stylesheet">
<style>
  /* Wake Forest brand: Old Gold #9E7E38 + black (primary); Athletics Gold #CEB888, Yellow #FDC314, Gray #53565A (secondary).
     Type: Cormorant (serif) + Nunito Sans (sans; condensed width used in the ticker). */
  :root{
    --old-gold:#9E7E38; --gold-lt:#CEB888; --yellow:#FDC314; --gray:#53565A;
    --ink:#000; --paper:#F5F1E8; --muted:rgba(245,241,232,.66); --line:rgba(245,241,232,.18);
    --serif:'Cormorant', Garamond, Georgia, serif; --sans:'Nunito Sans', system-ui, sans-serif;
    --qr:184px;
    /* Spacing standards (1920×1080 canvas, 8px base unit)
       window  = slide area: 80% of width (1536px) × everything above the ticker
       side    = remaining 20% (384px): clock + weather
       timebar = 4px rounded line across the top, 25px down, fills left→right
       timebar = story segments with slide labels above, along the bottom of the window (28px above the ticker)
       logo    = 78px tall, top-left of the window, 50px in / 50px down
       content = sits 50px above the timebar labels
       content = lower-left block, 960px wide (~60% of window), 50px above the ticker;
                 the right ~40% of the window stays clear so the image/video reads (trailer-style)
       upnext  = bottom-right of the window, 50px insets, right-aligned
       pad-x   = 50px: window side insets equal top/bottom insets
       stack   = 28–39px between kicker / headline / body / CTA */
    --win-w:1536px; --side-w:384px; --ticker-h:64px; --pad-x:50px; --pad-bottom:50px; --content-w:960px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;cursor:none}
  #stage{position:absolute;width:1920px;height:1080px;transform-origin:0 0;background:var(--ink);color:var(--paper);font-family:var(--sans);overflow:hidden}

  /* ---------- Livestream takeover: main window only; logo, tower, clock, weather and ticker stay ---------- */
  #slides,#timebar{transition:opacity 1.2s ease,visibility 0s}
  body.is-live #slides,body.is-live #timebar{visibility:hidden;transition:opacity 1.2s ease,visibility 0s 1.2s}
  body.is-live #slides,body.is-live #timebar{opacity:0}
  #live{position:absolute;left:0;top:0;width:1920px;bottom:var(--ticker-h);z-index:3;opacity:0;pointer-events:none;transition:opacity 1.2s ease;background:#000}
  body.is-live #live{opacity:1}
  body.is-live.touch #live .lframe{pointer-events:auto}
  /* full-bleed 16:9 stream (1646×926) tucked behind the logo and tower; every edge feathers into the black,
     the right edge dissolves under the tower, the bottom fade stays short so captions keep full contrast */
  #live .lframe{position:absolute;left:0;top:0;width:1646px;height:926px;background:#000}
  #live .lframe:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    background:linear-gradient(90deg,#000 0,rgba(0,0,0,0) 3.5%),linear-gradient(90deg,rgba(0,0,0,0) 84%,#000 96%),
      linear-gradient(180deg,#000 0,rgba(0,0,0,0) 6%),linear-gradient(180deg,rgba(0,0,0,0) 93%,#000 100%)}
  /* shade behind the logo so it stays legible over bright video */
  #live:after{content:"";position:absolute;left:0;top:0;width:900px;height:320px;pointer-events:none;
    background:radial-gradient(ellipse 100% 100% at 0 0,rgba(0,0,0,.72) 0%,rgba(0,0,0,.4) 45%,rgba(0,0,0,0) 75%)}
  #live iframe,#live video{width:100%;height:100%;border:0;display:block;object-fit:contain;background:#000}
  #live video::cue{font-family:var(--sans);font-size:34px;background:rgba(0,0,0,.78);color:#fff}
  #live .lbar{position:absolute;left:var(--pad-x);right:calc(var(--side-w) + var(--pad-x));bottom:26px;z-index:1;height:var(--ticker-h);display:flex;align-items:center;gap:26px}
  #live .meta{margin-top:0;font-size:30px;flex:none}
  .lsound{margin-left:auto;flex:none;display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .lsound svg{width:26px;height:26px}
  /* Zoom / un-embeddable links: scan-to-join card in the stream window */
  .lcard{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:70px;
    background:radial-gradient(900px 600px at 30% 40%,#2a2414 0%,#0d0b06 60%,#000 100%)}
  .lcard .kicker{margin-bottom:22px}
  .lcard h2{font-family:var(--serif);font-weight:600;font-size:96px;line-height:.95;max-width:720px}
  .lcard p{margin-top:22px;font-size:34px;color:var(--muted)}
  .lcard .qt{width:340px;height:340px;background:#fff;border-radius:22px;padding:22px;flex:none}
  .lcard .qt svg,.lcard .qt img{width:100%;height:100%;display:block}

  /* ---------- Slides & panels ---------- */
  #slides{position:absolute;left:0;top:0;bottom:var(--ticker-h);width:1920px;overflow:hidden;z-index:1}
  .slide{position:absolute;inset:0;overflow:hidden;transform:translateX(100%);transition:transform 1.6s cubic-bezier(.7,0,.25,1)}
  .slide.on{transform:none}
  .slide.out{transform:translateX(-100%)}
  .slide.noanim{transition:none}
  .panel{position:absolute;inset:0}
  .bg{position:absolute;inset:-2%}
  .bg video{width:100%;height:100%;object-fit:cover;display:block}
  .slide.on .bg{animation:drift var(--d) linear forwards}
  @keyframes drift{from{transform:scale(1)}to{transform:scale(1.07) translate(-1%,-1%)}}
  /* every image/video gets a uniform 30% black overlay, plus a deeper fade on the left and bottom where text sits */
  .shade{position:absolute;inset:0;background:
    linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.3)),
    linear-gradient(90deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.65) 34%,rgba(0,0,0,.12) 64%,rgba(0,0,0,0) 100%),
    linear-gradient(0deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 42%),
    linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 18%)}

  .t-gold   .bg{background:radial-gradient(1200px 800px at 75% 30%,#5c4719 0%,#231a09 45%,#000 80%)}
  .t-night  .bg{background:radial-gradient(1100px 900px at 72% 60%,#1d2a3a 0%,#0f1520 50%,#05070a 85%)}
  .t-ember  .bg{background:radial-gradient(1000px 800px at 80% 40%,#4e2a14 0%,#22130a 50%,#080504 85%)}
  .t-forest .bg{background:radial-gradient(1100px 900px at 75% 50%,#1f3324 0%,#101a13 50%,#050806 85%)}
  .t-stone  .bg{background:radial-gradient(1200px 900px at 50% 40%,#3a3c40 0%,#1c1d20 55%,#000 100%)}

  .art{position:absolute;right:-120px;top:50%;width:1000px;height:1000px;transform:translateY(-50%);opacity:.7}
  .has-video .art{display:none}

  .content{position:absolute;left:var(--pad-x);bottom:calc(var(--pad-bottom) + 60px);width:var(--content-w);transform:scale(.85);transform-origin:0 100%}
  .content h1{text-shadow:0 4px 40px rgba(0,0,0,.45)}
  .kicker{font-size:31px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-lt);margin-bottom:27px;display:flex;align-items:center;gap:20px}
  .kicker:before{content:"";width:64px;height:3px;background:var(--old-gold)}
  h1,.datebox .d,.count-num{font-variant-numeric:lining-nums}
  h1{font-family:var(--serif);font-weight:600;font-size:154px;line-height:.95;letter-spacing:-.01em}
  h1 em{font-style:italic;color:var(--gold-lt);font-weight:500}
  .body{margin-top:28px;font-size:43px;line-height:1.35;color:rgba(245,241,232,.78)}

  /* entrance */
  .slide .content > *{opacity:0;transform:translateX(70px)}
  .slide.out .content > *{animation:outL 1.05s cubic-bezier(.5,0,.75,0) forwards}
  @keyframes outL{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-60px)}}
  .slide.on .content > *{animation:rise 1.4s .8s cubic-bezier(.2,.7,.2,1) forwards}
  .slide.on .content > *:nth-child(2){animation-delay:.92s}
  .slide.on .content > *:nth-child(3){animation-delay:1.04s}
  .slide.on .content > *:nth-child(4){animation-delay:1.16s}
  .slide.on .content > *:nth-child(5){animation-delay:1.28s}
  @keyframes rise{to{opacity:1;transform:none}}

  /* QR CTA button — reversed (white) code + the call to action, inside one rounded outline */
  /* QR CTA: bottom-right of the window, on the same baseline as the text block; QR at far right, text right-aligned */
  /* --qp = padding around the QR; the corner radius equals it, so each rounded corner is concentric with the QR's corner */
  .qrcta{--qp:28px;margin-top:39px;display:inline-flex;flex-direction:row;align-items:center;gap:22px;padding:14px 34px 14px 14px;text-align:left;border:2px solid var(--old-gold);border-radius:var(--qp);background:rgba(0,0,0,.28)}
  .qrcta .code{width:var(--qr);height:var(--qr);flex:0 0 auto}
  .qrcta .code svg{width:100%;height:100%;display:block}
  /* prescribed codes usually export black-on-white: reverse to match the white-on-dark design; set qrInvert:false to show as supplied */
  .qrcta .code .qrimg{width:100%;height:100%;display:block;object-fit:contain;filter:invert(1) grayscale(1);mix-blend-mode:screen}
  .qrcta .code .qrimg.asis{filter:none;mix-blend-mode:normal}
  .qrcta .qrtile{width:100%;height:100%;background:#fff;border-radius:calc(var(--qp) - 14px);padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .qrcta .qrtile svg,.qrcta .qrtile img{width:100%;height:100%;display:block;object-fit:contain}
  /* Screens only: show the Maker's file cropped to the code + shield (wordmarks fall outside the window).
     Window = 1220 units square at (255.39, 214.36) of the 1728 artboard: 29 modules + 0.75 module white each side. */
  .qrcta .qrtile.crop{padding:12px}
  .qrcta .qcrop{position:relative;width:100%;height:100%;overflow:hidden}
  .qrcta .qcrop img.qrimg{position:absolute;width:141.639%;height:141.639%;max-width:none;left:-20.934%;top:-17.570%;object-fit:fill}
  .qrcta .q0{font-size:22px;font-weight:900;font-stretch:75%;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);line-height:1.1}
  .qrcta .q1{font-size:52px;font-weight:800;line-height:1.04;margin:6px 0 8px}
  .qrcta .q1 span{display:block;white-space:nowrap}
    .qrcta .q2 span{display:block;white-space:nowrap}
  .qrcta .q2{font-size:30px;font-weight:700;color:var(--gold-lt);line-height:1.15}

  /* countdown */
  .count-wrap{display:flex;align-items:flex-end;gap:44px}
  .count-num{font-family:var(--serif);font-size:360px;line-height:.78;color:var(--gold-lt);font-weight:500;letter-spacing:-.03em}
  .count-label{font-size:48px;line-height:1.2;padding-bottom:24px;font-weight:600}
  .count-label small{display:block;font-size:31px;color:var(--muted);margin-top:12px;font-weight:400}

  /* event */
  .event-row{display:flex;gap:34px;align-items:flex-start}
  .datebox{flex:0 0 auto;width:200px;border:2px solid var(--old-gold);border-radius:16px;text-align:center;padding:0 0 22px;overflow:hidden;background:rgba(0,0,0,.35)}
  .datebox .st{font-size:19px;font-weight:900;font-stretch:75%;letter-spacing:.16em;text-transform:uppercase;padding:9px 0 8px;margin-bottom:14px}
  .datebox .st.upcoming{background:var(--old-gold);color:#000}
  .datebox .st.recap{background:var(--paper);color:#000}
  .datebox .m{font-size:27px;font-weight:800;letter-spacing:.2em;color:var(--gold-lt)}
  .datebox .d{font-family:var(--serif);font-size:125px;line-height:1;font-weight:600}
  .datebox .w{font-size:23px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
  .event-row h1{font-size:125px;margin-top:-18px}
  .meta{margin-top:24px;font-size:38px;color:var(--muted);display:flex;align-items:baseline;gap:28px}
  .meta b{color:var(--paper);font-weight:700}
  .meta .sep{display:inline-block;width:2px;height:1.15em;background:currentColor;opacity:.45;margin:0 -6px;
    /* box bottom sits on the baseline; drop it so its middle lands at half the x-height = middle of the small caps */
    position:relative;top:calc((1.15em - 1ex) / 2)}
  /* location: all small caps, so its capitals sit at the time's x-height */
  .meta .loc{text-transform:uppercase;font-size:calc(1em * var(--x2cap,.69));letter-spacing:.1em;font-weight:700}
  .badge{display:inline-block;margin-top:6px;font-size:24px;font-weight:900;font-stretch:75%;letter-spacing:.16em;text-transform:uppercase;padding:8px 16px;border-radius:8px;margin-bottom:22px}
  .badge.upcoming{background:var(--old-gold);color:#000}
  .badge.recap{background:var(--paper);color:#000}
  .pg{display:flex;align-items:center;gap:12px;margin-left:24px}
  .pg i{width:36px;height:5px;border-radius:3px;background:var(--line)}
  .pg i.cur{background:var(--gold-lt)}
  .pg span{margin-left:8px;color:var(--muted);letter-spacing:.12em}

  /* quote */
    .quote h1{font-style:italic;font-size:91px;line-height:1.12;font-weight:500}
  .quote .body{margin-top:31px;color:var(--gold-lt);letter-spacing:.16em;text-transform:uppercase;font-size:31px;font-weight:800}

  /* spotlight */
    .spotlight h1{font-size:110px}
  /* spotlight: the student's photo/video fills the window; placeholder label shows where */
  .ph-note{position:absolute;right:120px;top:50%;transform:translateY(-50%);font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1.8;border:2px dashed var(--line);padding:40px 56px;border-radius:16px}

  /* ---------- Time bar: thin rounded line across the top, fills left to right ---------- */
  /* soft black fade behind the story bar so labels read on bright images/video */
  .barshade{position:absolute;left:0;width:var(--win-w);bottom:0;height:220px;pointer-events:none;
    background:linear-gradient(0deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.45) 35%,rgba(0,0,0,0) 100%)}
  /* story-style progress: one segment per slide — done = full, current = filling left→right, upcoming = empty */
  #timebar{position:absolute;left:var(--pad-x);right:calc(var(--side-w) + var(--pad-x));bottom:calc(var(--ticker-h) + 28px);z-index:7;display:flex;gap:8px}
  #timebar .tseg{flex:1;min-width:0}
  #timebar .trk{height:4px;border-radius:4px;background:rgba(245,241,232,.18);overflow:hidden}
  #timebar .trk i{display:block;height:100%;width:0;border-radius:4px;background:var(--gold-lt)}
  #timebar .tseg.done .trk i{width:100%}
  #timebar .tseg.now .trk i{animation:grow var(--d) linear forwards}
  /* each segment is labeled with its slide: active 90% opacity, the rest 50% */
  #timebar .tl{display:block;text-align:center;margin-bottom:10px;font-size:17px;font-weight:800;font-stretch:75%;letter-spacing:.08em;text-transform:uppercase;line-height:1;color:var(--paper);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.5;transition:opacity .6s ease;text-shadow:0 1px 10px rgba(0,0,0,.6)}
  #timebar .tseg.now .tl{opacity:.9}
  @keyframes grow{from{width:0%}to{width:100%}}

  /* ---------- Side column: clock + weather ---------- */
  #side{position:absolute;right:0;top:0;bottom:var(--ticker-h);width:var(--side-w);background:transparent;z-index:5;overflow:visible;display:flex;flex-direction:column;align-items:center;padding:40px 32px var(--sg) 34px;--sg:32px}

  /* ---------- Up Next: bottom-right of the main window, right-aligned, 75% ---------- */

  /* ---------- Weather (one group, two sub-groups) ----------
     All numbers: Cormorant Garamond in gold — full strength for primary values, dimmer gold for secondary (lows, hours).
     Now: icon | current temp | high / low ; rain chance left of the graph (temp line above rain bars) ; hours.
     Tomorrow: one compact row — icon | high / low | rain chance at far right. */
  #wxw{font-family:'Montserrat',var(--sans);position:relative}
  #wxw *{font-stretch:normal!important}
  #wxw .num{font-family:var(--serif);font-variant-numeric:lining-nums;color:var(--gold-lt);font-weight:600}
  #wxw .dim{color:rgba(206,184,136,.55)}
  #wxw .sample{position:absolute;right:0;top:24px;font-size:12px;font-weight:700;letter-spacing:.1em;color:#000;background:var(--muted);padding:2px 6px;border-radius:4px;text-transform:uppercase;z-index:2}
  #wxw .lab{font-size:15px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;line-height:1;margin-bottom:14px;color:var(--muted)}
  #wxw .hdr{display:flex;align-items:flex-end;gap:14px}
  #wxw .hdr > svg{align-self:center}
  #wxw .hdr svg{flex:0 0 auto;width:var(--ih);height:var(--ih);margin:calc((var(--dh) - var(--ih))/2) -6px}
  /* --dh = numeral height; the icon box is larger because its artwork fills ~75% of the box */
  #wxw .t0{--dh:58px; --ih:77px}
  #wxw .t1{--dh:32px; --ih:43px; margin-top:var(--sg)}
  /* divider: same 3px gold rule as the one above the weather, at 50% opacity.
     Sidebar rhythm --sg (32px) = bottom padding = space above/below both rules */
  #wxw .t1::before{content:"";display:block;height:3px;margin-bottom:var(--sg);background:rgba(206,184,136,.8);opacity:.5}
  #wxw .t0 .temp{font-size:94px;line-height:.62;color:var(--paper)}
  #wxw .hl{display:flex;align-items:baseline;gap:6px;margin-left:auto;line-height:.62;white-space:nowrap;padding-bottom:2px}
  #wxw .hl .num{font-size:36px}
  #wxw .hl .sl{font-family:var(--serif);font-size:36px;color:rgba(206,184,136,.55)}
  #wxw .t1 .pair{font-size:52px;line-height:.62}
  #wxw .t1 .rain{margin-left:auto;display:flex;align-items:flex-end;gap:6px}
  #wxw .t1 .rain .num{font-size:44px;line-height:.62}
  #wxw .graph{position:relative;margin-top:26px;display:grid;grid-template-columns:1fr auto;column-gap:14px;align-items:end}
  #wxw .gcol{min-width:0;position:relative}
  /* current-position dot on the temperature line: 50% larger, white glow; drawn as HTML so it stays perfectly round */
  #wxw .ndot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#CEB888;border:2px solid #050505;z-index:3;
    box-shadow:0 0 0 1px rgba(255,255,255,.35),0 0 10px 3px rgba(255,255,255,.7),0 0 22px 6px rgba(255,255,255,.3)}
  #wxw .tline{display:block;width:100%;height:26px;overflow:visible;position:relative;z-index:2}
  #wxw .pzone{position:relative;height:48px}
  #wxw .bars{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:3px;height:46px;border-bottom:1px solid var(--line)}
  #wxw .bars i{flex:1;background:#9DC0EA;border-radius:2px 2px 0 0;min-height:2px}
  #wxw .bars i.pk{background:#CFE2F7}
  #wxw .bars i.past{opacity:.25}
  #wxw .nowm{position:absolute;bottom:0;top:-10px;width:2px;background:var(--gold-lt);border-radius:1px}
  #wxw .t0 .rain{display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;padding-bottom:27px}
  #wxw .rl{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;letter-spacing:.14em;margin-bottom:8px;color:rgba(157,192,234,.85)}
  #wxw .t0 .rain .num{font-size:46px;line-height:.62}
  #wxw .rain .num{color:#9DC0EA}
  /* snow reads icy white, sleet a paler blue */
  #wxw .k-snow .bars i{background:#C9D6E6} #wxw .k-snow .bars i.pk{background:#F2F6FB}
  #wxw .k-snow .rain .num,#wxw .rain.k-snow .num{color:#E6EEF8} #wxw .k-snow .rl{color:rgba(230,238,248,.85)}
  #wxw .k-sleet .bars i{background:#AFC8E6} #wxw .k-sleet .rain .num,#wxw .rain.k-sleet .num{color:#C3D7EF} #wxw .k-sleet .rl{color:rgba(195,215,239,.85)}
  #wxw .pct{font-size:.55em;margin-left:1px}
  #wxw .axis{display:flex;justify-content:space-between;margin-top:6px;font-size:19px}

  /* ---------- Ticker (same footprint; condensed bold, +10%) ---------- */
  #ticker{position:absolute;left:0;right:0;bottom:0;height:var(--ticker-h);background:#000;border-top:2px solid var(--old-gold);display:flex;align-items:center;z-index:10;
    font-stretch:75%;font-weight:800}
  /* countdown to the next livestream, left of the Announcements label */
  /* countdown block, inline in the ticker: gentle top-lit gradient + bevel for a soft 3D read */
  #soon{flex:0 0 auto;height:100%;display:none}
  body.soon #soon{display:flex}
  /* live label: the same countdown bar, floated into the stream's lower-left corner */
  /* live label: the countdown bar itself, lifted straight up to sit on the ticker, then stretched to the chapel sidebar edge */
  #livetab{position:absolute;left:0;bottom:var(--ticker-h);height:var(--ticker-h);width:calc(1920px - var(--side-w));max-width:none;z-index:9;
    opacity:0;pointer-events:none;transition:transform 1.1s cubic-bezier(.45,0,.25,1),width 1.1s cubic-bezier(.45,0,.25,1),opacity .8s ease}
  body.is-live #livetab{opacity:1}
  #livetab.flying{transition:none}
  /* stream ends: drop straight down behind the ticker (ticker sits above at z 6), fading once it's mostly tucked away */
  /* layers: ticker (10) > white bar (9) > story bar (7) > slides — so returning slides fade in behind the bar as it drops */
  #livetab.dropping{transform:translateY(var(--ticker-h));opacity:0;
    transition:transform 1.1s cubic-bezier(.45,0,.55,1),opacity .6s ease .6s}
  /* the glimmer is a countdown cue only: it stops once the stream is live */
  #livetab:after{content:none;animation:none}
  #livetab .sep{display:inline-block;width:2px;height:36px;background:#7A5F22;opacity:.45;flex:none;margin:0 -4px}
  #livetab .loc{font-size:calc(36px * var(--x2cap,.69));font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6B6458;white-space:nowrap;line-height:1}
  #livetab .lsound{margin-left:auto;color:#6B6458}
  #livetab .st{flex:0 1 auto;min-width:0;max-width:none}
  #livetab .sl,#livetab .sep,#livetab .locw{flex:none}
  #livetab .sc{overflow:hidden;max-width:4em;transition:max-width 1.1s cubic-bezier(.45,0,.25,1),opacity .6s ease,margin 1.1s cubic-bezier(.45,0,.25,1)}
  #livetab.nonow .sc{max-width:0;opacity:0;margin-left:-20px}
  /* counter box: value stays left-aligned; on a minute change (and 0:01 → NOW) the old value slides out left, clipped at the box edge */
  .ctab .sc,.ctab .dg{position:relative;display:inline-flex;align-items:center;text-transform:uppercase}
  .ctab .cv{display:inline-flex;align-items:center;gap:.32em}
  .ctab .cv .ci{color:#7A5F22}
  .ctab b{font-weight:900;color:#000}
  /* rolls never clip: the old value drifts left as it fades to 0, then the new one drifts in from the right as it fades up */
  .ctab .out{position:absolute;left:0;top:0;animation:rollOut .8s cubic-bezier(.45,0,.55,1) forwards}
  .ctab .in{animation:rollIn .9s cubic-bezier(.25,.8,.35,1) .35s both}
  @keyframes rollOut{0%{opacity:1;transform:none}55%{opacity:0}100%{opacity:0;transform:translateX(-.45em)}}
  @keyframes rollIn{0%{opacity:0;transform:translateX(.6em)}100%{opacity:1;transform:none}}
  /* location waits until the bar settles: the divider fades in, then the words slide out from behind it */
  #livetab .locw{display:inline-flex;align-items:center}
  #livetab .sep{opacity:0;transition:opacity .8s ease}
  #livetab .loc{display:inline-block;opacity:0;transform:translateX(-.45em);transition:transform 1.1s cubic-bezier(.25,.8,.35,1) .3s,opacity 1.1s ease .3s}
  #livetab .lsound{opacity:0;transform:translateX(.45em);transition:transform 1.1s cubic-bezier(.25,.8,.35,1) .5s,opacity 1.1s ease .5s}
  #livetab.show .sep{opacity:.45}
  #livetab.show .loc,#livetab.show .lsound{transform:none;opacity:1}
  /* the countdown's slot empties the moment the bar lifts off, then closes up as the ticker slides left */
  #soon.vacant{background:none;box-shadow:none}
  #soon.vacant>*,#soon.vacant:after{visibility:hidden}
  #soon.collapse{transition:width 1.1s cubic-bezier(.45,0,.25,1),padding 1.1s cubic-bezier(.45,0,.25,1);padding-left:0;padding-right:0}
  /* one type spec for the countdown and the live bar, wherever they sit (the ticker's condensed width is set here, not inherited) */
  .ctab{font-family:var(--sans);font-stretch:75%;font-weight:900;font-style:normal;display:flex;align-items:center;gap:20px;padding:0 30px 0 34px;max-width:1100px;position:relative;z-index:2;
    background:linear-gradient(180deg,#FFFFFF 0%,#F6F3EC 38%,#E6DFD0 82%,#D6CDB9 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -3px 6px rgba(120,100,60,.22),inset -1px 0 0 rgba(120,100,60,.25),4px 0 14px rgba(0,0,0,.45)}
  /* glimmer: a wide, soft diagonal band of light sweeps left→right across the countdown every 5s */
  .ctab{overflow:hidden}
  .ctab:after{content:"";position:absolute;top:-20%;bottom:-20%;width:380px;pointer-events:none;
    background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.12) 22%,rgba(255,255,255,.42) 40%,rgba(255,255,255,.6) 50%,rgba(255,255,255,.42) 60%,rgba(255,255,255,.12) 78%,rgba(255,255,255,0) 100%);
    left:-420px;transform:skewX(-18deg);animation:glimmer 5s cubic-bezier(.45,0,.55,1) infinite}
  /* sweep takes 2.6s (half the old speed), then rests until the next 5s cycle */
  @keyframes glimmer{0%{left:-420px}52%{left:calc(100% + 60px)}100%{left:calc(100% + 60px)}}
  .ctab .sl,.ctab .st{font-size:36px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#7A5F22;white-space:nowrap;line-height:1}
  /* title → LIVE uses the same word space as LIVE → IN (.32em), cancelling the tab's 20px item gap */
  .ctab .st{overflow:hidden;text-overflow:ellipsis;min-width:0;margin-right:calc(.32em - 20px)}
  .ctab .sl{display:flex;align-items:center;gap:.32em}
  /* LIVE reads as letters cut out of the white bar with a red gel lit from behind: an engraved edge, and a glow that strobes dark → bright */
  .ctab .lv{color:#5E0B0E;animation:gel 1.4s ease-in-out infinite alternate}
  @keyframes gel{
    0%  {color:#5E0B0E;text-shadow:0 1px 0 rgba(255,255,255,.9),0 -1px 0 rgba(0,0,0,.35)}
    100%{color:#FF3A34;text-shadow:0 1px 0 rgba(255,255,255,.9),0 -1px 0 rgba(90,0,0,.25),0 0 6px rgba(255,70,50,.95),0 0 16px rgba(255,40,30,.75),0 0 30px rgba(255,30,20,.45)}}
  /* countdown numbers: same style as LIVE IN, same word space before them; tabular figures so the line doesn't shift each second */
  .ctab .sc{font-size:36px;font-weight:900;letter-spacing:.14em;color:#000;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;margin-left:calc(.32em - 20px)}
  #brand{flex:0 0 auto;height:100%;display:flex;align-items:center;padding:0 31px 0 34px;background:var(--old-gold);
    font-size:20px;font-weight:900;font-stretch:75%;letter-spacing:.12em;text-transform:uppercase;color:#F4E7C5}
  /* official reversed lockup (gold shield + white wordmark), top-left of the window on the content grid */
  #logo{position:absolute;left:var(--pad-x);top:50px;height:78px;width:auto;z-index:6;filter:drop-shadow(0 2px 16px rgba(0,0,0,.5))}
  #marquee{flex:1;overflow:hidden;height:100%;display:flex;align-items:center;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
  #track{display:flex;white-space:nowrap;animation:scroll linear infinite;will-change:transform}
  #track span{font-size:26px;font-weight:800;padding:0 26px;display:flex;align-items:center}
  #track span.sep{color:var(--old-gold);padding:0;font-size:18px}

  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  /* clock: large, in the sidebar above the weather */

  #clock .hm{display:block;height:var(--ch);line-height:1;overflow:visible}

  #clock .ap{font-size:26px;margin:0 0 -1px 6px;font-weight:600;color:rgba(206,184,136,.7);line-height:.72}
  /* calendar box: one padding value (--p) everywhere — around the month label, above the date, between date and weekday,
     below the weekday, and on the left/right. Line-heights are trimmed to the glyphs so the gaps read as truly equal. */
  /* sidebar date box — same style as the event date box: gold outline on dark,
     gold month caps, white Cormorant date, muted weekday caps. One padding value (--p) throughout. */
  .cal{--p:calc(var(--ch)*.12);flex:0 0 auto;border:2px solid var(--old-gold);border-radius:12px;overflow:hidden;background:rgba(0,0,0,.35);text-align:center;display:flex;flex-direction:column}
  .cal .cm{color:var(--gold-lt);font-size:calc(var(--ch)*.22);font-weight:800;letter-spacing:.18em;line-height:.72;padding:var(--p) var(--p) 0}
  .cal .cd{font-family:var(--serif);font-variant-numeric:lining-nums;color:var(--paper);font-size:calc(var(--ch)*.6);font-weight:600;line-height:.6;padding:var(--p) var(--p) 0}
  .cal .cw{color:var(--muted);font-size:calc(var(--ch)*.19);font-weight:700;letter-spacing:.12em;line-height:.72;padding:var(--p)}
  #sidebot{position:absolute;left:34px;top:0;width:356px;display:flex;flex-direction:column;transform-origin:0 0;will-change:transform}
  /* analog clock: transparent tower-style face, top of sidebar, sweeping seconds */
  #analog{position:absolute;width:250px;height:250px;left:0;top:0;transform-origin:0 0}
  /* sidebar shape: left edge traced from Wait Chapel's steeple (dusk photo), zoomed so the clock stage frames the clock.
     Accurate profile: cornice above the clock stage, clock stage, corner urns, heavy lower cornice, entablature band, brick shaft.
     Belfry/spire crop off the top. The brick shaft meets the main window at the usual 1536px line. */
  #tower{position:absolute;left:0;top:0;width:1920px;height:calc(1080px - var(--ticker-h));z-index:4;pointer-events:none}
  #analog svg{width:100%;height:100%;display:block;overflow:visible}
  #sidebot #wxw{flex:0 0 auto;margin-top:var(--sg);padding-top:var(--sg);border-top:3px solid rgba(206,184,136,.8)}
</style>

<script>
/* =====================================================================
   CONTENT — placeholder copy, dates, links and videos.

     screens  → which TVs show the item (rotunda / admissions / auditorium)

     cta      → the prompt beside it ("Scan to · Apply now"); ctaSub is the line under it

    kicker:'Happening at Wake Div', thumb:'Upcoming Events',
    events:[
      { status:'upcoming', date:'2026-11-05', title:'Community Worship', time:'Thu · 11:00 AM', place:'Lower Auditorium',
        qrCode:'6D6', cta:'Add to calendar' },
      { status:'upcoming', date:'2026-11-18', title:'Admissions Info Session', time:'12:00 PM', place:'[Location]',
        qrCode:'6D7', cta:'Register', ctaSub:'For prospective students', video:'media/bg-night.mp4' },
      { status:'recap', date:'2026-10-24', title:'[Fall Lecture] Recap', time:'Highlights', place:'2 min video',

    qrCode:'6D9', thumb:'Lunch & Learn' },
];

let TICKER = [
  { text:'Pro Humanitate' },
  { hot:'Now', text:'Applications open for Fall 2027 · divinity.wfu.edu' },
  { text:'Thursday Community Worship · 11:00 AM · Lower Auditorium' },
  { hot:'Reminder', text:'[Placeholder announcement] Registration closes Friday' },
  { text:'Follow @WakeDiv for stories from our community' },
];

/* LIVE — livestream takeovers (becomes the Sheet's "Live" tab: Title | Stream URL | Start | End | Screens | Mode | Location | QR code).
   Mode: auto = on between Start and End · on = force it live now · off = ignore this row.
   Stream URL: a YouTube video/live link or channel link (youtube.com/channel/UC…), a direct .m3u8 or .mp4 stream,
   another player's EMBED link (BoxCast, Panopto…), or a Zoom link (Zoom can't play on a screen: shows a scan-to-join card).
   Sound: on (default) / off for that event. */
let LIVE = [
  { title:'Community Worship', url:'https://www.youtube.com/live/[VIDEO_ID]', start:'2026-11-05 11:00', end:'2026-11-05 12:00',
    screens:['rotunda','admissions','auditorium'], mode:'off', place:'Wait Chapel', sound:'on' },
];
// Livestream venues (the Live tab's Location dropdown). Left: what's picked in the sheet · right: what the screens show.
// "Other" rows show whatever is typed.
const VENUES = {
  'Wait Chapel':'Wait Chapel',
  'Davis Chapel':'Davis Chapel',
  'Kulynych Auditorium':'Kulynych Auditorium · Byrum Welcome Center',
};
const venue = p => (p && VENUES[String(p).trim()]) || p || '';
// live bar: the space only ("Kulynych Auditorium · Byrum Welcome Center" → "Kulynych Auditorium") so it never runs off the bar
const space = p => venue(p).split(/\s*(?:·|\||,|–|—)\s*/)[0];
// Settings tab: "Sound on screens" — which screens may play livestream audio. Each device must also allow autoplay with sound.
let SOUND_SCREENS = ['rotunda','admissions','auditorium'];
// Fixed words on screen; the Sheet's "Screen labels" can override each one
let LBL = { scanTo:'Scan to', upcoming:'Upcoming', icymi:'ICYMI', announcements:'Announcements', live:'Live', in:'In', now:'Now',
  wxNow:'Now', tomorrow:'Tomorrow', rain:'Rain', snow:'Snow', sleet:'Sleet' };
// Settings tab: "Countdown minutes" — the ticker shows LIVE IN mm:ss this long before a scheduled stream.
let COUNTDOWN_MIN = 60;
// preview only (press L, or add ?live=demo): a local clip stands in for a stream
const LIVE_DEMO = { title:'Community Worship', url:'media/bg-night.mp4', place:'Wait Chapel', demo:true };
// preview only (press C, or add ?soon=demo): a stream scheduled 42 minutes out
let SOON_DEMO = null;

const CHANNELS = { rotunda:'Rotunda Lobby', admissions:'Admissions Lounge', auditorium:'Lower Auditorium' };
let WX = { lat:36.0999, lon:-80.2442 }; // Winston-Salem

/* ===================================================================== */
const $ = s => document.querySelector(s);
const stage = $('#stage');
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = `scale(${s})`;
  stage.style.left = (innerWidth - 1920*s)/2 + 'px';
  stage.style.top  = (innerHeight - 1080*s)/2 + 'px';
}
addEventListener('resize', fit); fit();

const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function parseWhen(v){
  if(v instanceof Date) return v;
  const t = String(v || '').trim().replace(/^[A-Za-z]{3,9}\.?,?\s+(?=\d)/, ''); if(!t) return null;   // drops a leading weekday ("Thu 11/5/2026")
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])?)?$/);
  let y, mo, d, h = 0, mi = 0, se = 0, ap;
  if(m){ [, y, mo, d, h = 0, mi = 0, se = 0, ap] = m; }
  else if((m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:,?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])?)?$/))){ [, mo, d, y, h = 0, mi = 0, se = 0, ap] = m; if(+y < 100) y = 2000 + +y; }
  else { const x = new Date(t); return isNaN(x) ? null : x; }
  h = +h; if(ap){ ap = ap.toLowerCase(); if(ap === 'pm' && h < 12) h += 12; if(ap === 'am' && h === 12) h = 0; }
  return new Date(+y, +mo - 1, +d, h, +mi, +se);
}
const ymd = s => parseWhen(s) || new Date();
let channel = 'admissions';

/* QR as inline SVG (no outside service needed). Adds tracking tags so scans show up in web analytics by screen. */
/* ── DMC QR system ──
   Every CTA uses a code ID from the DMC QR system: year digit + type letter + number (signage = D, Display), e.g. 6D1.
   The page shows the branded code image exported for that ID (qr/6D1.png — WAKE FOREST / shield / DIVINITY, pure #000000),
   untouched, on a white tile. If the image is missing it falls back to a plain code for the same go link:
   HTTPS://GO.WFU.EDU/div6d1  (capitalized scheme + host, lowercase path). No tracking parameters are ever added.
   (Older notes below kept for reference.)
   QR codes: the PRESCRIBED code from the QR tracking system is always preferred.
   qrImage → the exact image exported from the tracking system (PNG/SVG); shown untouched except reversed to white-on-dark
   qr      → fallback only: a link encoded exactly as given (no extra tracking parameters added) */
const QR_DIR = 'qr/';
const goLink = id => 'HTTPS://GO.WFU.EDU/div' + String(id).toLowerCase();
function qrSVG(url, ink){
  const u = url;
  const q = qrcode(0,'M'); q.addData(u); q.make();
  const n = q.getModuleCount(); let d = '';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${d}" fill="${ink||'#fff'}"/></svg>`;
}

/* Branded QR fallback chain. Generated codes are cached so each runs the scan tests once per device. */
const QR_GEN = {};
function qrBranded(code){
  if(QR_GEN[code]) return QR_GEN[code];
  const key = 'wakediv-qr:' + code;
  const job = async () => {
    try { const s = localStorage.getItem(key); if(s) return s; } catch(e){}
    const r = await MAKER.build(code);
    if(!r) return null;
    try { localStorage.setItem(key, r.svg); } catch(e){}
    return r.svg;
  };
  // one code at a time, so a slow screen device isn't asked to scan-test several codes at once
  return QR_GEN[code] = (qrBranded.queue = (qrBranded.queue || Promise.resolve()).then(job).catch(() => null));
}
function qrMiss(img){
  const tile = img.closest('.qrtile'); if(!tile) return;
  const code = tile.dataset.code;
  img.style.visibility = 'hidden';
  if(!img.dataset.step){ img.dataset.step = 'png'; img.src = QR_DIR + code + '.png'; return; }
  img.onerror = null;
  qrBranded(code).then(svg => { if(!svg) return;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); img.dataset.step = 'made'; });
}
document.addEventListener('load', e => { if(e.target.classList && e.target.classList.contains('qrimg')) e.target.style.visibility = ''; }, true);
const ART = `<svg class="art" viewBox="0 0 1000 1000" fill="none" stroke="#9E7E38">
  ${[480,400,320,240,160].map((r,i)=>`<circle cx="500" cy="500" r="${r}" stroke-opacity="${.18+i*.07}" stroke-width="1.5"/>`).join('')}
  <path d="M500 20 V980 M20 500 H980" stroke-opacity=".16"/></svg>`;

/* A slide is one or more panels. 'events' becomes one panel per event. */
function panelsOf(c){
  if(c.type!=='events') return [c];
  const today = new Date(); today.setHours(0,0,0,0);
  const evs = c.events.filter(e => (!e.screens || e.screens.includes(channel)) && !(e.status !== 'recap' && ymd(e.date) < today));
  return evs.map((e,i)=>({ ...e, type:'event', theme:e.theme||c.theme, kicker:c.kicker, duration:c.per||10, _i:i, _n:evs.length, _all:evs }));
}

function qrBtn(p){
  if(!p.qrCode && !p.qr && !p.qrImage) return '';
  let code;
  if(p.qrCode){
    // the Maker's own export: qr/<ID>.svg, then qr/<ID>.png; if neither is uploaded yet, the Maker's generator draws it here
    code = `<img src="${p.qrImage || QR_DIR + p.qrCode + '.svg'}" alt="QR ${p.qrCode}" class="qrimg asis" onerror="qrMiss(this)">`;
    code = `<div class="qrtile crop" data-code="${String(p.qrCode).toUpperCase()}"><div class="qcrop">${code}</div></div>`;
  } else code = p.qrImage ? `<img src="${p.qrImage}" alt="" class="qrimg ${p.qrInvert===false?'asis':''}">` : qrSVG(p.qr);
  // break the prompt onto two lines (first half of the words / the rest) to keep the button narrow

// What kind of player a link needs
function liveSource(url, sound){
  let u; try{ u = new URL(url, location.href); }catch(e){ return { kind:'card' }; }
  if(!/^https?:$/.test(u.protocol)) return { kind:'card' };
  const h = u.hostname.replace(/^(www|m)\./,'');
  const yt = id => ({ kind:'frame', src:`https://www.youtube.com/embed/${id}?${YT_P}&mute=${sound?0:1}` });
  const ytChannel = ch => ({ kind:'frame', src:`https://www.youtube.com/embed/live_stream?channel=${ch}&${YT_P}&mute=${sound?0:1}` });
  if(/(^|\.)zoom(gov)?\.(us|com)$/.test(h)) return { kind:'card', zoom:true };
  if(h === 'youtu.be') return yt(u.pathname.slice(1));
  if(/(^|\.)youtube(-nocookie)?\.com$/.test(h)){
    if(u.searchParams.get('v')) return yt(u.searchParams.get('v'));
    if(u.pathname.startsWith('/embed/live_stream')) return ytChannel(u.searchParams.get('channel'));
    let m = u.pathname.match(/^\/(?:live|embed|shorts)\/([\w-]{6,})/); if(m) return yt(m[1]);
    m = u.pathname.match(/^\/channel\/(UC[\w-]+)/); if(m) return ytChannel(m[1]);
    return { kind:'card' };            // e.g. youtube.com/@handle/live — no ID to embed, so scan-to-watch
  }
  if(/\.m3u8$/i.test(u.pathname)) return { kind:'hls', src:u.href };
  if(/\.(mp4|webm|mov)$/i.test(u.pathname)) return { kind:'video', src:u.href };
  return { kind:'frame', src:u.href }; // another player's embed link
}

function liveQR(l){

  return qrSVG(l.url, '#000');
}

const STRETCH_S = 1.1;
function revealAt(x, w0, w1, dur){
  const f = (x - w0) / (w1 - w0); if(f <= 0) return 0; if(f >= 1) return dur;
  const bz = (t, a, b) => 3*a*t*(1-t)*(1-t) + 3*b*t*t*(1-t) + t*t*t;      // cubic-bezier(.45,0,.25,1)
  for(let t = 0; t <= 1; t += .005) if(bz(t, 0, 1) >= f) return bz(t, .45, .25) * dur;
  return dur;
}

  if(handoff){

  const go = () => { const hls = new Hls({ enableWebVTT:true, renderTextTracksNatively:true });
    hls.on(Hls.Events.ERROR, (e, d) => { if(d.fatal){ hls.destroy(); retry(); } });

function stopLive(){

/* countdown: the next scheduled stream for this screen within COUNTDOWN_MIN minutes */
function nextLive(){
  const now = new Date(), horizon = +now + COUNTDOWN_MIN*60e3;
  const rows = LIVE.concat(SOON_DEMO ? [SOON_DEMO] : []);
  return rows.filter(l => l.url && String(l.mode||'auto').toLowerCase() === 'auto' && (!l.screens || l.screens.includes(channel)))
    .map(l => ({ l, t: atLocal(l.start) })).filter(x => x.t && +x.t > +now - 3000 && +x.t <= horizon).sort((a,b) => a.t - b.t)[0] || null;
}
const cvHTML = v => v === 'now' ? `<b>${LBL.now}</b>` : `<span class="ci">${LBL.in}</span><span class="dg"><b>${v}</b></span>`;
let soonVal = '';
// swap old → new inside a clipping box: old slides out left, new slides in
function roll(box, oldEl, html, cls, tag){
  const nw = document.createElement(tag || 'span'); if(cls) nw.className = cls; nw.innerHTML = html; nw.classList.add('in');
  oldEl.classList.add('out'); setTimeout(() => oldEl.remove(), 850);
  box.appendChild(nw); setTimeout(() => nw.classList.remove('in'), 1300);
}
function setCounter(v){
  const box = $('#soonc'), cur = box.querySelector('.cv:not(.out)');
  if(v === soonVal && cur) return;
  if(!cur || !soonVal){
    box.style.minWidth = ''; box.innerHTML = `<span class="cv">${cvHTML(v)}</span>`; soonVal = v;
    // reserve the starting width so the bar never resizes (and never clips) as digits drop away
    const dg = box.querySelector('.dg'); if(dg) requestAnimationFrame(() => { dg.style.minWidth = dg.offsetWidth + 'px'; });
    return;
  }
  if(v === 'now'){ box.style.minWidth = box.offsetWidth + 'px'; roll(box, cur, cvHTML(v), 'cv'); }                                       // "IN 0:01" → "NOW"
  else if(v.length !== soonVal.length || /:59$/.test(v) || !/:/.test(v) || !/:/.test(soonVal)){                                 // minute change: digits only
    const dg = cur.querySelector('.dg'); roll(dg, dg.querySelector('b:not(.out)'), v, '', 'b'); }
  else cur.querySelector('.dg b:not(.out)').textContent = v;
  soonVal = v;
}
function tickSoon(){
  if(liveHandoff) return;

  const left = Math.max(0, Math.ceil((n.t - new Date())/1000));
  // under a minute the leading zero drops (1:00 → :59 … :01 → NOW)
  const d = Math.floor(left/86400), h = Math.floor(left/3600);
  setCounter(!left ? 'now' : d >= 1 ? `${d} ${d === 1 ? 'day' : 'days'}` : h >= 1 ? `${h} ${h === 1 ? 'hr' : 'hrs'}`
    : (left >= 60 ? Math.floor(left/60) : '') + ':' + String(left%60).padStart(2,'0'));
  const t = strip(n.l.title); if($('#soont').textContent !== t) $('#soont').textContent = t;
  if(left <= 1) setTimeout(checkLive, 2400);   // let "NOW" fully land before the bar lifts
}

/* analog clock — matched to Wait Chapel's steeple clock (close-up photos), colors reversed for the dark sidebar:
   • raised outer molding ring joined to the dial by four wide rectangular blocks at 12 / 3 / 6 / 9
   • thick outer band with the minute dots set inside it
   • tall, narrow, equal-width radial Roman numerals filling the band down to a thick inner ring
   • spade-tipped hands: long slender minute hand, short stout hour hand
   The gold second hand is an addition (the real clock has none). */
const FACE = { ink:'#F2ECDF', hole:'#0b0b0b', second:'#C9A75A', four:'IIII' };
function buildAnalog(){
  const C = FACE.ink;
  // blocks run from the dial edge (r≈95) out past the molding ring (r≈122), 18 units wide
  const blocks = [0,90,180,270].map(a=>`<rect x="111" y="-2.5" width="18" height="28" rx="1" fill="url(#mold)" transform="rotate(${a} 120 120)"/>`).join('');
  const dots = Array.from({length:60},(_,i)=>`<circle cx="120" cy="${120-90.5}" r="${i%5?1.45:1.9}" fill="${FACE.hole}" transform="rotate(${i*6} 120 120)"/>`).join('');
  // numerals built from identical glyphs: every I, V and X has the same height, width and stroke weights
  // (thick stem/diagonal 2.8, hairline 0.9, serifs 1.0), set radially between the outer band and inner ring
  const T = 37.5, B = 63.5, S = 2.8, HL = .9, SF = 1;
  const poly = p => `<path d="M${p.map(q=>q.join(' ')).join(' L')} Z"/>`;
  const serif = (x0,x1,y) => `<rect x="${x0}" y="${y}" width="${x1-x0}" height="${SF}"/>`;
  const G = {
    I: { w:5.6, d:x => `<rect x="${x+2.8-S/2}" y="${T}" width="${S}" height="${B-T}"/>` + serif(x,x+5.6,T) + serif(x,x+5.6,B-SF) },
    V: { w:8.8, d:x => poly([[x+.3,T],[x+.3+S,T],[x+4.4+.9,B],[x+4.4-.9,B]]) + poly([[x+8.8-1.2,T],[x+8.8-1.2+HL,T],[x+4.4+.5,B],[x+4.4-.2,B]])
                     + serif(x-.5,x+S+1,T) + serif(x+8.8-2.1,x+9.3,T) },
    X: { w:9.6, d:x => poly([[x+.3,T],[x+.3+S,T],[x+9.3,B],[x+9.3-S,B]]) + poly([[x+9.6-1.3,T],[x+9.6-1.3+HL,T],[x+1.4,B],[x+.5,B]])
                     + serif(x-.4,x+S+1.1,T) + serif(x+9.6-2.2,x+10,T) + serif(x-.4,x+2.3,B-SF) + serif(x+9.6-S-1.1,x+10,B-SF) },
  };
  const numeral = str => { const gap = .9, w = [...str].reduce((a,c)=>a+G[c].w,0) + gap*(str.length-1);
    let x = 120 - w/2, out = ''; for(const c of str){ out += G[c].d(x); x += G[c].w + gap; } return out; };
  const nums = ['XII','I','II','III',FACE.four,'V','VI','VII','VIII','IX','X','XI'].map((n,i)=>
    `<g fill="${C}" transform="rotate(${i*30} 120 120)">${numeral(n)}</g>`).join('');

/* rectangle (w×h, origin top-left) → screen quad [TL,TR,BR,BL] as a CSS matrix3d (unit-square homography, Heckbert) */
function quadMatrix(w, h, q){
  const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]] = q;
  const dx1=x1-x2, dx2=x3-x2, dx3=x0-x1+x2-x3, dy1=y1-y2, dy2=y3-y2, dy3=y0-y1+y2-y3, den = dx1*dy2-dx2*dy1;
  const g=(dx3*dy2-dx2*dy3)/den, hh=(dx1*dy3-dx3*dy1)/den;
  const A=x1-x0+g*x1, B=x3-x0+hh*x3, C=x0, D=y1-y0+g*y1, E=y3-y0+hh*y3, F=y0;
  return `matrix3d(${A/w},${D/w},0,${g/w}, ${B/h},${E/h},0,${hh/h}, 0,0,1,0, ${C},${F},0,1)`;
}

/* Project the time/date + weather panel onto the brick shaft's front face (t = -140), in the tower's exact perspective.
   The panel keeps its proportions (no stretching); it is sized to the largest rectangle on the face that fits between
   the cornice and the ticker, so it reads as if projected onto the stone. */
function projectPanel(){
  const el = document.querySelector('#sidebot'); if(!window.TOWER_PROJ || !el) return;
  const { P } = window.TOWER_PROJ, w = el.offsetWidth, h = el.offsetHeight;
  const face = (u, vy) => P(u, -140, vy);
  const solve = (fn, target, lo, hi) => { for(let i=0;i<60;i++){ const m=(lo+hi)/2; if(fn(m)<target) lo=m; else hi=m; } return (lo+hi)/2; };
  // panel is viewed with its own eye level at its baseline, so the baseline projects perfectly flat (parallel to the
  // screen framework) while the far/left side still recedes slightly. Sized to the largest panel under the cornice.
  const LEFT = 1594, RIGHT = 1898, TOP = 462, BASE = 990;   // LEFT leaves ~30px between the pilaster line and the data   // TOP = underside of the cornice on the near (right) side
  const face2 = (u, vy) => window.TOWER_PROJ.Peye(u, -140, vy, BASE);
  const u0 = solve(u => face2(u,1100)[0], LEFT, -140, 140);
  const v1 = solve(v => face2(u0,v)[1], BASE, 900, 1700);
  const v0 = 1110 + 15;                                   // architrave + one spacing unit (--sg)
  let Wu = (v1 - v0) * w / h;                             // keep the panel's proportions
  while(face2(u0+Wu, v1)[0] > RIGHT) Wu -= 1;
  const u1 = u0+Wu;
  el.style.transform = quadMatrix(w, h, [face2(u0,v0), face2(u1,v0), face2(u1,v1), face2(u0,v1)].map(([x,y]) => [x-1536-34, y]));
}

/* fit the digital time to the sidebar and size the calendar box to the digits' measured height */
function sizeClock(){
  const el = $('#clock'), row = $('#clockrow'), avail = $('#sidebot').clientWidth;
  let f = 110;
  for(;;){
    el.style.fontSize = f+'px';
    const c = document.createElement('canvas').getContext('2d'); c.font = `600 ${f}px Cormorant, Georgia, serif`;
    const m = c.measureText('0123456789');
    const ink = m.actualBoundingBoxAscent, fa = m.fontBoundingBoxAscent, fd = m.fontBoundingBoxDescent;
    const baseline = (f - (fa + fd))/2 + fa;              // baseline position inside a line-height:1 box
    row.style.setProperty('--ch', Math.round(ink)+'px');   // calendar box height = digit height
    el.style.setProperty('--chy', -(baseline - ink)+'px'); // pull digits up so their tops meet the box top
    if(row.scrollWidth <= avail || f <= 60) break; f -= 2;
  }
}

/* clock */
function tick(){
  const n = new Date(), [hm, ap] = n.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).split(' ');
  $('#clock').innerHTML = `<span class="hm"><span>${hm}</span></span><span class="ap">${ap}</span>`;
  sizeClock();
  $('#calm').textContent = MON[n.getMonth()]; $('#cald').textContent = n.getDate(); $('#calw').textContent = DOW[n.getDay()].toUpperCase();
}

/* weather — live from Open-Meteo (free, no key) once hosted. The preview can't reach it, so it shows labeled sample data. */
const ICON = {
  sun:   `<svg viewBox="0 0 64 64" fill="none" stroke-linecap="round"><circle cx="32" cy="32" r="12" fill="#CEB888"/><g stroke="#CEB888" stroke-width="4">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="32" y1="8" x2="32" y2="14" transform="rotate(${a} 32 32)"/>`).join('')}</g></svg>`,
  cloudPath: 'M18 48h28a11 11 0 0 0 1-22 15 15 0 0 0-29-3A12.5 12.5 0 0 0 18 48z',
};
/* precipitation type from the forecast code: snow (71–77, 85–86), sleet / freezing rain or drizzle (56, 57, 66, 67), otherwise rain */
const precipKind = c => (c>=71&&c<=77)||c===85||c===86 ? 'snow' : [56,57,66,67].includes(c) ? 'sleet' : 'rain';
function wxIcon(code){
  const cloud = (y=0, fill='#F5F1E8') => `<path d="${ICON.cloudPath}" transform="translate(0 ${y})" fill="${fill}"/>`;
  const svg = inner => `<svg viewBox="0 0 64 64" fill="none" stroke-linecap="round">${inner}</svg>`;
  if(code<=1) return ICON.sun;
  if(code===2) return svg(`<circle cx="24" cy="22" r="10" fill="#CEB888"/>${cloud(4)}`);
  if(code===3) return svg(cloud(-2,'#c9c5bd'));
  if(code===45||code===48) return svg(`<g stroke="#c9c5bd" stroke-width="4"><line x1="12" y1="24" x2="52" y2="24"/><line x1="8" y1="34" x2="48" y2="34"/><line x1="16" y1="44" x2="56" y2="44"/></g>`);
  const flake = (x, y, r) => `<g stroke="#E6EEF8" stroke-width="2.4" transform="translate(${x} ${y})">${[0,60,120].map(a=>`<line x1="0" y1="${-r}" x2="0" y2="${r}" transform="rotate(${a})"/>`).join('')}</g>`;
  if(precipKind(code) === 'snow') return svg(`${cloud(-8,'#c9c5bd')}${flake(21,50,5)}${flake(33,57,5)}${flake(44,49,5)}`);
  if(precipKind(code) === 'sleet') return svg(`${cloud(-8,'#c9c5bd')}<g stroke="#9DC0EA" stroke-width="4"><line x1="22" y1="45" x2="19" y2="54"/><line x1="40" y1="45" x2="37" y2="54"/></g><g fill="#E6EEF8"><circle cx="30" cy="51" r="3.2"/><circle cx="26" cy="59" r="3.2"/><circle cx="44" cy="59" r="3.2"/></g>`);
  if(code>=95) return svg(`${cloud(-8,'#c9c5bd')}<path d="M34 42l-8 12h7l-3 9 10-14h-7l3-7z" fill="#FDC314"/>`);
  return svg(`${cloud(-8,'#c9c5bd')}<g stroke="#9DC0EA" stroke-width="4"><line x1="22" y1="46" x2="19" y2="56"/><line x1="32" y1="46" x2="29" y2="56"/><line x1="42" y1="46" x2="39" y2="56"/></g>`);
}
const WXNAME = c => c<=0?'Clear':c===1?'Mostly clear':c===2?'Partly cloudy':c===3?'Cloudy':(c===45||c===48)?'Fog':(c===56||c===57||c===66||c===67)?'Sleet':(c>=51&&c<=55)?'Drizzle':(c>=61&&c<=65)?'Rain':(c>=71&&c<=77)?'Snow':(c>=80&&c<=82)?'Showers':(c===85||c===86)?'Snow showers':'Thunderstorms';

const fmtS = h => h===0?'12a':h<12?h+'a':h===12?'12p':(h-12)+'p';
const DROP = `<svg viewBox="0 0 24 24" width="13" height="13" style="width:13px;height:13px;margin:0 2px 0 0;vertical-align:-1px"><path d="M12 3c4 5 6 8.5 6 11a6 6 0 0 1-12 0c0-2.5 2-6 6-11z" fill="#9DC0EA"/></svg>`;

const FLAKE = `<svg viewBox="0 0 24 24" width="13" height="13" style="width:13px;height:13px;margin:0 2px 0 0;vertical-align:-1px"><g stroke="#E6EEF8" stroke-width="2.4" stroke-linecap="round">${[0,60,120].map(a=>`<line x1="12" y1="3" x2="12" y2="21" transform="rotate(${a} 12 12)"/>`).join('')}</g></svg>`;
const SLEETI = `<svg viewBox="0 0 24 24" width="13" height="13" style="width:13px;height:13px;margin:0 2px 0 0;vertical-align:-1px"><path d="M9 2c3 4 4.5 6.5 4.5 8.5a4.5 4.5 0 0 1-9 0C4.5 8.5 6 6 9 2z" fill="#9DC0EA"/><circle cx="17.5" cy="17.5" r="3.6" fill="#E6EEF8"/></svg>`;
const PRECIP = { rain:{ icon:DROP, label:'rain' }, snow:{ icon:FLAKE, label:'snow' }, sleet:{ icon:SLEETI, label:'sleet' } };
const AXIS = `<div class="axis num dim"><span>6a</span><span>12p</span><span>6p</span><span>11p</span></div>`;
const peakOf = hrs => hrs.reduce((a,b)=> b.p>a.p ? b : a, hrs[0]);

/* today's graph: temperature line (dot = now) above hourly rain bars, short NOW marker; rain chance to its left */
function graph(day, now){
  const k = precipKind(day.code), P = PRECIP[k];
  const hrs = day.hourly, n = hrs.length, pk = peakOf(hrs);
  const ts = hrs.map(x=>x.t), tmin = Math.min(...ts), tmax = Math.max(...ts);
  const bars = hrs.map(x=>`<i class="${x===pk&&pk.p>0?'pk':''} ${now && x.h<now.hour?'past':''}" style="height:${Math.max(4, x.p)}%"></i>`).join('');
  const X = i => (i + .5) / n * 300, Y = t => 29 - (t - tmin) / Math.max(1, tmax - tmin) * 25;
  const pts = hrs.map((x,i)=>`${X(i).toFixed(1)},${Y(x.t).toFixed(1)}`).join(' ');
  let marker = '', dot = '';
  if(now && now.hour>=6 && now.hour<=23){
    const nowPct = (now.hour + now.min/60 - 6)/18*100;
    marker = `<span class="nowm" style="left:calc(${nowPct}% - 1px)"></span>`;
    const fi = Math.min(n-1, Math.max(0, now.hour - 6 + now.min/60 - .5)), i0 = Math.floor(fi), f = fi - i0;
    const tNow = hrs[i0].t + ((hrs[Math.min(n-1,i0+1)].t - hrs[i0].t) * f);
    dot = `<span class="ndot" style="left:${nowPct}%;top:${(Y(tNow)/30*26).toFixed(1)}px"></span>`;
  }
  const line = `<svg class="tline" viewBox="0 0 300 30" preserveAspectRatio="none" style="margin-bottom:-18px">
      <polyline points="${pts}" fill="none" stroke="rgba(245,241,232,.75)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>${dot}`;
  const rain = `<div class="rain"><span class="rl">${P.icon}${LBL[P.label]}</span><span class="num">${pk.p}<span class="pct">%</span></span></div>`;
  return `<div class="graph k-${k}"><div class="gcol">${line}<div class="pzone"><div class="bars">${bars}</div>${marker}</div>${AXIS}</div>${rain}</div>`;
}

let lastWx = null;
function renderWx(w, sample){
  lastWx = [w, sample];
  const n = new Date(), t = w.today, m = w.tom, mp = peakOf(m.hourly);
  $('#wday0').innerHTML = `<div class="lab">${LBL.wxNow}</div>
    <div class="hdr">${wxIcon(w.now.code)}<span class="num temp">${Math.round(w.now.temp)}°</span>
      <div class="hl"><span class="num">${Math.round(t.hi)}°</span><span class="sl">/</span><span class="num dim">${Math.round(t.lo)}°</span></div></div>
    ${graph(t, {hour:n.getHours(), min:n.getMinutes()})}`;
  $('#wday1').innerHTML = `<div class="lab">${LBL.tomorrow}</div>
    <div class="hdr">${wxIcon(m.code)}<span class="num pair">${Math.round(m.hi)}° <span class="dim">/ ${Math.round(m.lo)}°</span></span>
      <span class="rain k-${precipKind(m.code)}">${PRECIP[precipKind(m.code)].icon.replace(/13/g,'20')}<span class="num">${mp.p}<span class="pct">%</span></span></span></div>`;
}

const hrsOf = (arr, temps) => arr.map((p,i)=>({h:6+i, p, t:temps[i]}));
const SAMPLE_WX = { now:{temp:58, code:2},
  today:{ code:2, hi:64, lo:41, hourly:hrsOf([0,0,0,0,5,5,10,10,15,20,25,30,30,25,20,15,10,10],[42,43,46,50,54,57,60,62,63,64,63,61,58,55,52,50,48,46]) },
  tom:  { code:61, hi:61, lo:45, hourly:hrsOf([5,5,10,15,25,40,55,60,60,50,35,25,20,15,10,10,5,5],[45,46,48,51,54,56,58,59,61,60,58,55,53,51,49,48,47,46]) } };

const PREVIEW_WX = /[?&]preview/.test(location.search);
async function weather(){
  try{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${WX.lat}&longitude=${WX.lon}`
      + `&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min`
      + `&hourly=precipitation_probability,temperature_2m&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=2`;
    const j = await (await fetch(u)).json(), d = j.daily;
    const hourly = date => j.hourly.time.map((ts,i)=>({ts, h:+ts.slice(11,13), p:j.hourly.precipitation_probability[i], t:j.hourly.temperature_2m[i]}))
      .filter(x => x.ts.startsWith(date) && x.h >= 6);
    const day = k => ({ code:d.weather_code[k], hi:d.temperature_2m_max[k], lo:d.temperature_2m_min[k], hourly:hourly(d.time[k]) });
    const wx = { now:{temp:j.current.temperature_2m, code:j.current.weather_code}, today:day(0), tom:day(1) };
    renderWx(wx, false);
    try{ localStorage.setItem('wakediv-wx', JSON.stringify({ at:Date.now(), wx })); }catch(_){}
  }catch(e){
    let last = null; try{ last = JSON.parse(localStorage.getItem('wakediv-wx') || 'null'); }catch(_){}
    if(last && Date.now() - last.at < 12*36e5) renderWx(last.wx, false);
    else if(PREVIEW_WX) renderWx(SAMPLE_WX, true);
  }
}

/* preview controls (only with ?preview in the address): ← → step, 1/2/3 switch screens, L / C / G livestream states */
const PREVIEW = /[?&]preview/.test(location.search);
addEventListener('keydown', e=>{
  if(!PREVIEW) return;
  if(e.key==='ArrowRight') show(idx+1);
  if(e.key==='ArrowLeft') show(idx-1);
  const k = {'1':'rotunda','2':'admissions','3':'auditorium'}[e.key]; if(k) location.hash = k;
  if(!PREVIEW) return;
  if(e.key==='l' || e.key==='L') preview(liveCur ? 'slides' : 'live');
  if(e.key==='c' || e.key==='C') preview(SOON_DEMO && !liveCur ? 'slides' : 'countdown');
  if(e.key==='g' || e.key==='G') preview('golive');
});
addEventListener('hashchange', () => { liveCur = null; document.body.classList.remove('is-live'); $('#live').innerHTML = ''; build(); checkLive(); });

/* ---------- content from the Google Sheet ----------
   The Sheet (shared "anyone with the link can view") is read as CSV, one block of the Dashboard tab at a time.
   Every cell is treated as plain text: *word* becomes gold italics, a line break inside a cell becomes a line break.
   The last good copy is saved on this screen, so a network or Google outage keeps showing the most recent content. */
const ALL_SCREENS = ['rotunda','admissions','auditorium'];
const LBL_DEFAULT = Object.assign({}, LBL);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = v => esc(v).trim().replace(/\*([^*\n]+)\*/g, '<em>$1</em>').replace(/\r?\n/g, '<br>');
const yes = v => !/^(no|n|false|0|off|hide)$/i.test(String(v || '').trim());
function screensOf(v){
  const t = String(v || '').toLowerCase();
  if(!t.trim() || /\ball\b/.test(t)) return ALL_SCREENS.slice();
  if(/\bnone\b/.test(t)) return [];
  return ALL_SCREENS.filter(k => t.includes(k));
}
function mediaOf(v){
  const t = String(v || '').trim(); if(!t) return {};
  let src;
  if(/^https:\/\//i.test(t)) src = t;
  else if(/^[\w.\- ]+$/.test(t)) src = 'media/' + t;
  else return {};
  return /\.(jpe?g|png|webp|gif|avif)(\?|$)/i.test(src) ? { image:src } : { video:src };
}
function parseRows(text){
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch === '"') q = true;
    else if(ch === ','){ row.push(cell); cell = ''; }
    else if(ch === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if(ch !== '\r') cell += ch;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim()));
}
// Reads one block of the Dashboard tab (fixed slots) as CSV rows of plain values
async function readRange(id, range){
  const u = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(id)}/gviz/tq?tqx=out:csv&headers=0&sheet=Dashboard&range=${range}&t=${Date.now()}`;
  const r = await fetch(u, { cache:'no-store' });
  if(!r.ok) throw new Error(range + ' ' + r.status);
  const t = await r.text();
  if(/^\s*</.test(t)) throw new Error('not shared');   // got a sign-in page, not CSV
  return parseRows(t);
}
// Sheet layout — keep in step with the Dashboard tab
const RANGES = { slides:'B14:R33', ticker:'B37:E46', live:'T14:AD17', lead:'W21:W21', labels:'V23:W28', labels2:'AA23:AB28' };
const LABEL_KEYS = { 'scan to':'scanTo', 'upcoming':'upcoming', 'icymi':'icymi', 'announcements':'announcements', 'live':'live', 'in':'in',
  'now (livestream)':'now', 'now (weather)':'wxNow', 'tomorrow':'tomorrow', 'rain':'rain', 'snow':'snow', 'sleet':'sleet' };
const QRID = v => String(v || '').trim().toUpperCase().replace(/[^0-9A-Z]/g, '');

function fromSheet(t){
  const content = [], events = [];
  for(const r of t.slides || []){
    const [, show, scr, type0, bar, kicker, head, body, date, time, loc, cta, ctaSub, qr, bg, theme, secs] = r;
    if(!yes(show) || !String(head || '').trim()) continue;
    const type = String(type0 || 'promo').toLowerCase();
    const th = String(theme || '').toLowerCase();
    const base = { screens: screensOf(scr), theme: ['gold','night','ember','forest','stone'].includes(th) ? th : 'stone',
      duration: Math.max(4, +secs || 10), cta: esc(cta || ''), ctaSub: esc(ctaSub || ''), qrCode: cta ? QRID(qr) : '', ...mediaOf(bg) };
    if(type === 'event' || type === 'recap'){
      if(!parseWhen(date)) continue;
      events.push({ ...base, status: type === 'recap' ? 'recap' : 'upcoming', date, title: md(head), time: esc(time), place: esc(loc) });
      continue;
    }
    const o = { ...base, type: ['promo','countdown','quote','spotlight'].includes(type) ? type : 'promo',
      kicker: md(kicker), title: md(head), body: md(body), thumb: esc(bar || String(head).replace(/[*\n]/g, ' ').trim()) };
    if(o.type === 'countdown'){ o.deadline = date; o.label = o.title; o.sub = o.body; }
    content.push(o);
  }
  events.sort((a, b) => parseWhen(a.date) - parseWhen(b.date));
  if(events.length) content.push({ type:'events', screens: ALL_SCREENS.slice(), theme:'night', per: events[0].duration, kicker:'', thumb:'', events });
  const ticker = (t.ticker || []).filter(r => yes(r[1]) && String(r[3] || '').trim()).map(r => ({ hot: esc(r[2] || ''), text: esc(r[3]) }));
  const live = (t.live || []).filter(r => r[2] && r[3]).map(r => ({
    mode: /^on/i.test(String(r[1] || '').trim()) ? 'on' : String(r[1] || 'off').trim().toLowerCase(),
    title: esc(r[2]), url: r[3], start: r[4] && r[5] ? `${r[4]} ${r[5]}` : '', end: r[4] && r[6] ? `${r[4]} ${r[6]}` : '',
    place: esc(r[7]), screens: screensOf(r[8]), soundScreens: screensOf(String(r[9] || '').trim() ? r[9] : 'All'), qrCode: QRID(r[10]) }));
  const labels = {};
  for(const [k, v] of (t.labels || []).concat(t.labels2 || [])){ const key = LABEL_KEYS[String(k || '').trim().toLowerCase()]; if(key && String(v || '').trim()) labels[key] = esc(String(v).trim()); }
  const lead = parseInt(((t.lead || [])[0] || [])[0], 10);
  return { content, ticker, live, labels, settings: { countdownMin: (lead || 1) * 60 } };
}

let pendingContent = null, contentSig = '';
function useContent(d){
  if(!d || !d.content || !d.content.length) return false;
  CONTENT = d.content; TICKER = d.ticker.length ? d.ticker : TICKER; LIVE = d.live;
  COUNTDOWN_MIN = d.settings.countdownMin;
  LBL = Object.assign({}, LBL_DEFAULT, d.labels || {});
  if(lastWx) renderWx(lastWx[0], lastWx[1]);
  return true;
}
// swap new content in between slides (never mid-livestream), then restart the rotation
function applyContent(){
  const d = pendingContent; pendingContent = null;
  if(!useContent(d)) return false;
  buildTicker(); build(); checkLive();
  return true;
}
async function loadContent(){
  const id = (window.SIGNAGE_CONFIG || {}).sheetId;
  if(!id) return;
  try{
    const t = {};
    await Promise.all(Object.entries(RANGES).map(async ([k, rg]) => { try{ t[k] = await readRange(id, rg); }catch(e){ if(k === 'slides') throw e; } }));
    const d = fromSheet(t), sig = JSON.stringify(d);
    if(!d.content.length || sig === contentSig) return;
    const first = !contentSig; contentSig = sig;
    try{ localStorage.setItem('wakediv-content', sig); }catch(_){}
    pendingContent = d;
    if(first && !liveCur) applyContent();
  }catch(e){ /* keep showing what we have */ }
}
// start from the last good copy saved on this screen
try{ const c = localStorage.getItem('wakediv-content'); if(c && (window.SIGNAGE_CONFIG || {}).sheetId){ useContent(JSON.parse(c)); contentSig = c; } }catch(_){}

build(); buildTicker(); tick(); setInterval(tick, 10000);
loadContent(); setInterval(loadContent, 2*60*1000);
weather(); setInterval(weather, 15*60*1000);
/* Preview states — keys: L live on/off (off plays the drop), C countdown on/off, G 6-second countdown that goes live */
function preview(state){
  if(state === 'end') state = 'slides';
  liveDemo = state === 'live';
  SOON_DEMO = state === 'countdown' ? demoSoon() : state === 'golive' ? demoSoon(6) : null;
  checkLive(); tickSoon();          // live first, so a showing countdown hands off to the stream
}

function demoSoon(sec){ const t = new Date(Date.now() + (sec ? sec*1e3 : 42*60e3 + 15e3)), f = d => new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,19).replace('T',' ');
  return { title:'Community Worship', url:'media/bg-night.mp4', start:f(t), end:f(new Date(+t + 36e5)), mode:'auto', place:'Wait Chapel' }; }
if(PREVIEW && /[?&]soon=demo/.test(location.search)) SOON_DEMO = demoSoon();
checkLive(); setInterval(checkLive, 15000);
tickSoon(); setInterval(tickSoon, 1000);
// hourly refresh for new content/code — but never in the middle of a livestream
const BOOT = Date.now(); setInterval(() => { if(!liveCur && Date.now() - BOOT > 60*60*1000) location.reload(); }, 60000);
</script>
